<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CAFÉ/9 · Menú</title>
<meta name="description" content="Café de especialidad, frío y caliente. Pide por WhatsApp.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1a1f;--cream:#f0e8e0;--ease:cubic-bezier(.22,.8,.24,1);box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory;-webkit-text-size-adjust:100%;background:#111}
body{background:#111;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.disp{font-family:"Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:.92}
nav{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.06em;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.mark{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.mark svg{width:18px;height:18px}
#basket{height:38px;padding:0 14px;border:1.5px solid rgba(255,255,255,.9);border-radius:99px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#basket.bump{animation:bk .32s}
@keyframes bk{50%{transform:scale(1.18)}}
#badge{background:#fff;color:var(--ink);font:500 10.5px "DM Mono",monospace;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
#badge.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0)}}
#chips{position:fixed;z-index:45;top:calc(62px + env(safe-area-inset-top,0px));left:16px;display:flex;gap:6px}
.pill{height:32px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.35)}
.pill.on{background:#fff;color:var(--ink)}
.slide{position:relative;height:100svh;min-height:540px;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--c)}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.12);transition:transform 6s ease-out}
.slide.on>img{transform:scale(1)}
.sh{position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--c) 40%,#000) 0,color-mix(in srgb,var(--c) 40%,transparent) 38%,transparent 62%),linear-gradient(rgba(0,0,0,.25),transparent 22%)}
.cnt{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(96px + env(safe-area-inset-bottom,0px));max-width:620px;display:flex;flex-direction:column;gap:10px}
.num{font-size:64px;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);line-height:.9}
.num small{font:500 13px "DM Mono",monospace;-webkit-text-stroke:0;color:rgba(255,255,255,.9);margin-left:6px;letter-spacing:.1em}
.slide h2{font-size:min(11.5vw,56px);color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.slide h2 .w{display:inline-block;white-space:nowrap;margin-right:.22em}
.slide h2 .l{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
.slide h2 .l i{display:inline-block;font-style:normal;transform:translateY(110%);opacity:0;transition:transform .62s cubic-bezier(.22,1,.36,1) var(--d),opacity .62s cubic-bezier(.22,1,.36,1) var(--d)}
.slide.on h2 .l i{transform:none;opacity:1}
.slide p{font:400 13.5px/1.45 "DM Mono",monospace;max-width:340px;text-shadow:0 1px 10px rgba(0,0,0,.3);opacity:0;translate:0 14px;transition:opacity .6s .35s,translate .6s .35s var(--ease)}
.slide.on p,.slide.on .row,.slide.on .act{opacity:1;translate:0 0}
.row{display:flex;align-items:center;gap:10px;opacity:0;translate:0 14px;transition:opacity .6s .45s,translate .6s .45s var(--ease)}
.price{font:400 28px "Archivo Black",sans-serif}
.tag{font:500 10.5px "DM Mono",monospace;background:#fff;color:var(--ink);padding:3px 6px;text-transform:uppercase;border-radius:3px}
.act{opacity:0;translate:0 14px;transition:opacity .6s .55s,translate .6s .55s var(--ease)}
.btn{height:52px;min-width:200px;padding:0 24px;border-radius:99px;background:#fff;color:var(--ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.step{display:none;height:52px;min-width:200px;border-radius:99px;background:#fff;color:var(--ink);align-items:center;justify-content:space-between;padding:0 6px}
.step button{width:44px;height:44px;font-size:22px;color:var(--ink)}
.step b{font:500 16px "DM Mono",monospace}
.slide.has .btn{display:none}.slide.has .step{display:inline-flex}
.hint{position:absolute;right:18px;bottom:calc(112px + env(safe-area-inset-bottom,0px));font:500 11px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;writing-mode:vertical-rl;opacity:.85;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(6px)}}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;color:var(--ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;z-index:40;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
#tot{flex:1;font:400 11px "DM Mono",monospace;color:#7b7e84;text-transform:uppercase;letter-spacing:.05em}
#tot b{display:block;font:400 22px "Archivo Black",sans-serif;color:var(--ink);letter-spacing:0}
#tot.bump b{animation:bmp .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bmp{40%{transform:translateY(-6px) scale(1.25)}}
#bar .btn{min-width:0;height:46px;font-size:14px;background:var(--ink);color:#fff}
#sheet{position:fixed;inset:0;z-index:60;visibility:hidden;color:var(--ink)}
#sheet.open{visibility:visible}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
#sheet.open #shade{opacity:1}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;overscroll-behavior:contain;background:#fff;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .45s cubic-bezier(.65,0,.25,1);max-width:600px;margin:0 auto;border-radius:22px 22px 0 0}
#sheet.open #panel{transform:none}
#panel h2{font:400 22px "Archivo Black",sans-serif;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:10px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e3e3e6;font-size:13px;font-weight:500}
.line span{flex:1}.line .q{display:flex;align-items:center;background:#eceef1;border-radius:99px}
.line .q button{width:34px;height:34px;font-size:16px;color:var(--ink)}.line .q i{font-style:normal;min-width:20px;text-align:center}
.line em{font:normal 400 12px "DM Mono",monospace;min-width:62px;text-align:right}
.empty{font:400 13px/1.5 "DM Mono",monospace;color:#7b7e84;padding:14px 0}
.total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding:14px 0;font:400 17px "Archivo Black",sans-serif;text-transform:uppercase}
.field{width:100%;height:44px;background:#eceef1;padding:0 14px;font:400 16px "DM Mono",monospace;color:var(--ink);border:0;outline:0;margin-bottom:6px;border-radius:99px}
.wa{width:100%;height:50px;background:#1f9d55;color:#fff;font-weight:700;font-size:15px;border-radius:99px;margin-top:8px}
.wa:disabled{opacity:.4}
.mesa{background:#eceef1;border-radius:18px;padding:12px;margin-bottom:10px}
.mesa label{display:block;font:500 11px "DM Mono",monospace;letter-spacing:.1em;margin-bottom:8px}
.mrow{display:flex;gap:8px}
.mrow .field{margin:0;background:#fff;flex:0 0 96px;text-align:center;font-size:18px;height:46px}
.mrow .field:disabled{opacity:.7}
.cf{flex:1;height:46px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:13px}
.cf:disabled{opacity:.35}.cf.ok{background:#1f9d55}
.mmsg{font:400 11px/1.4 "DM Mono",monospace;color:#7b7e84;margin-top:8px}.mmsg.ok{color:#1f7a45}
.note{font:400 10.5px "DM Mono",monospace;color:#7b7e84;text-transform:uppercase;margin-top:10px}
@media(min-width:900px){.cnt{left:50%;transform:translateX(-50%);width:620px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-snap-type:none}.slide h2 .l i,.slide p,.row,.act{transform:none;opacity:1;translate:0 0}}
</style>
</head>

<nav><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="#1c1a1f"><path d="M3 19 9 7l4 7 3-4 5 9z"/></svg></div>CAFÉ/9</div>

<main id="feed"></main>

const N=ITEMS.length,q={};const $=s=>document.querySelector(s);
const money=n=>"$"+n.toLocaleString("es-MX");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const feed=$("#feed");
function title(name){let i=0;return name.split(" ").map(w=>`<span class="w">${[...w].map(ch=>`<span class="l"><i style="--d:${80+22*(i++)}ms">${ch}</i></span>`).join("")}</span>`).join("")}
ITEMS.forEach((it,k)=>{
 const s=document.createElement("section");s.className="slide";s.dataset.c=it.c;s.dataset.k=k;s.style.setProperty("--c",it.col);
 s.innerHTML=`<img src="${IMG[k]}" alt="${it.n}"${k?' loading="lazy"':''}><div class="sh"></div>
 <div class="cnt"><div class="num disp">${String(k+1).padStart(2,"0")}<small>/ ${String(N).padStart(2,"0")}</small></div>
 <h2 class="disp" aria-label="${it.n}">${title(it.n)}</h2><p>${it.d}</p>

 <div class="act"><button class="btn add">Agregar</button><div class="step"><button data-d="-1" aria-label="Quitar">−</button><b class="n">0</b><button data-d="1" aria-label="Agregar">+</button></div></div></div>

});
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("on",e.isIntersecting)),{threshold:.6});
[...feed.children].forEach(s=>io.observe(s));
/* filtros */
$("#chips").addEventListener("click",e=>{
 const b=e.target.closest(".pill");if(!b)return;
 document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on",p===b));
 [...feed.children].forEach(c=>c.style.display=(b.dataset.f==="all"||c.dataset.c===b.dataset.f)?"":"none");
 scrollTo({top:0,behavior:"instant"});
});
/* carrito */
function fly(btn,k){
 if(reduce||!btn)return;const r=btn.getBoundingClientRect(),b=$("#basket").getBoundingClientRect();
 const w=64,h=80,im=document.createElement("img");im.src=IMG[k];
 Object.assign(im.style,{position:"fixed",left:r.left+r.width/2-w/2+"px",top:r.top+r.height/2-h/2+"px",width:w+"px",height:h+"px",objectFit:"cover",zIndex:70,pointerEvents:"none",borderRadius:"10px",boxShadow:"0 10px 14px rgba(0,0,0,.35)"});
 document.body.appendChild(im);
 const dx=b.left+b.width/2-(r.left+r.width/2),dy=b.top+b.height/2-(r.top+r.height/2);
 im.animate([{transform:"none",opacity:1},{transform:`translate(${dx*.4}px,${dy*.4-Math.min(160,.35*Math.abs(dy)+60)}px) scale(.7) rotate(-10deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.25) rotate(-18deg)`,opacity:.15}],{duration:900,easing:"cubic-bezier(.5,0,.2,1)"}).onfinish=()=>{im.remove();const bk=$("#basket");bk.classList.remove("bump");void bk.offsetWidth;bk.classList.add("bump")};
}
function change(k,d,btn){
 const nv=Math.max(0,(q[k]||0)+d);if(nv===(q[k]||0))return;q[k]=nv;if(d>0)fly(btn,k);update(true);
}
function update(bump){
 let sum=0,cnt=0,html="";
 ITEMS.forEach((it,k)=>{
  const n=q[k]||0,el=feed.children[k];
  el.classList.toggle("has",n>0);el.querySelector(".n").textContent=n;
  if(n){sum+=n*it.p;cnt+=n;html+=`<div class="line"><span>${it.n}</span><div class="q"><button data-k="${k}" data-d="-1">−</button><i>${n}</i><button data-k="${k}" data-d="1">+</button></div><em>${money(n*it.p)}</em></div>`}
 });
 $("#sum").textContent=$("#sum2").textContent=money(sum);$("#cnt").textContent=cnt;
 const bd=$("#badge");if(bd.textContent!=cnt){bd.textContent=cnt;bd.classList.remove("pop");void bd.offsetWidth;bd.classList.add("pop")}
 $("#lines").innerHTML=html||'<div class="empty">Aún no has agregado nada. Desliza el menú y elige tus bebidas.</div>';
 syncWa();
 if(bump){const t=$("#tot");t.classList.remove("bump");void t.offsetWidth;t.classList.add("bump")}
}
feed.addEventListener("click",e=>{
 const el=e.target.closest(".slide");if(!el)return;const k=+el.dataset.k;
 if(e.target.closest(".add"))change(k,1,e.target.closest(".add"));
 else{const b=e.target.closest("[data-d]");if(b)change(k,+b.dataset.d,b)}
});
$("#lines").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)change(+b.dataset.k,+b.dataset.d)});
